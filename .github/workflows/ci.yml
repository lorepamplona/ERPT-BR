name: Test source patcher

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  test-windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13.15"
          cache: pip
          cache-dependency-path: patcher/requirements-win64.lock

      - name: Verify pinned official Python bootstrap
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $url = "https://www.python.org/ftp/python/3.13.15/python-3.13.15-amd64.exe"
          $expectedHash = "edec09c4853aeae9ac36efb8c9f95b6b8e2fee65eee56d9767a8b7c69c574403"
          $expectedPublisher = "CN=Python Software Foundation, O=Python Software Foundation, L=Beaverton, S=Oregon, C=US"
          $manifestUrl = "https://raw.githubusercontent.com/microsoft/winget-pkgs/9a9e78cfec415bd294cced116b786562a9c32017/manifests/p/Python/Python/3/13/3.13.15/Python.Python.3.13.installer.yaml"
          $manifest = Join-Path $env:RUNNER_TEMP "Python.Python.3.13.installer.yaml"
          & "$env:SystemRoot\System32\curl.exe" --fail --show-error --proto "=https" --tlsv1.2 --retry 2 --output $manifest $manifestUrl
          $manifestHash = (Get-FileHash -LiteralPath $manifest -Algorithm SHA256).Hash
          if ($manifestHash -ne "7fe6aab138453720882711688ffb220f9fd81a42c56bfe7d4a10939e6de052c2") {
            throw "Manifesto WinGet fixado divergiu"
          }
          $metadata = Get-Content -LiteralPath $manifest -Raw
          foreach ($expected in @($url, $expectedHash)) {
            if ($metadata.IndexOf($expected, [StringComparison]::OrdinalIgnoreCase) -lt 0) {
              throw "Manifesto WinGet nao contem $expected"
            }
          }
          $installer = Join-Path $env:RUNNER_TEMP "python-3.13.15-amd64-verification.exe"
          & "$env:SystemRoot\System32\curl.exe" --fail --show-error --proto "=https" --tlsv1.2 --retry 2 --output $installer $url
          $item = Get-Item -LiteralPath $installer
          if ($item.Length -ne 29452944) { throw "Tamanho do instalador Python divergiu" }
          $actualHash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash
          if ($actualHash -ne $expectedHash) { throw "SHA-256 do instalador Python divergiu" }
          $signature = Get-AuthenticodeSignature -LiteralPath $installer
          if ($signature.Status -ne "Valid" -or $signature.SignerCertificate.Subject -ne $expectedPublisher) {
            throw "Assinatura ou publicador do instalador Python divergiu"
          }

      - name: Install locked dependencies
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip --isolated install `
            --disable-pip-version-check `
            --no-input `
            --require-hashes `
            --only-binary=:all: `
            -r patcher/requirements-win64.lock
          python -m pip check

      - name: Compile and test
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python -m compileall -q patcher tools
          python -m unittest discover -s tests -v
          python -I -c "import tkinter,customtkinter; from Crypto.Cipher import AES"

      - name: Reject legacy high-risk behavior
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          if (Test-Path patcher/launcher.py) { throw "launcher dinamico proibido" }
          $forbiddenArtifacts = Get-ChildItem -Recurse -File | Where-Object {
            $_.Extension -match '^(?i:\.exe|\.dll|\.pyd)$' -or
            $_.Name -match '(?i:pyinstaller|nuitka)'
          }
          if ($forbiddenArtifacts) {
            throw "artefato/binario ou script de empacotamento proibido: $($forbiddenArtifacts.FullName -join ', ')"
          }
          $checked = @(
            Get-ChildItem patcher -Recurse -File
            Get-ChildItem interno -Recurse -File
            Get-Item tools/build_source_release.py
            Get-Item ERPT-BR.cmd
          )
          if ($checked | Select-String -Pattern '(?i)\b(pyinstaller|nuitka)\b') {
            throw "ferramenta de empacotamento executavel encontrada"
          }
          if ($checked | Select-String -SimpleMatch "exec(compile(") {
            throw "execucao de codigo remoto encontrada"
          }
          if ($checked | Select-String -SimpleMatch "taskkill") {
            throw "encerramento forcado de processo encontrado"
          }

      - name: Smoke test installer directly from checkout
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $wheelhouse = Join-Path $PWD "wheelhouse"
          New-Item -ItemType Directory -Force $wheelhouse | Out-Null
          python -m pip --isolated download `
            --disable-pip-version-check `
            --no-input `
            --require-hashes `
            --only-binary=:all: `
            --dest $wheelhouse `
            -r patcher/requirements-win64.lock

          if (-not (Test-Path "$env:SystemRoot\py.exe")) {
            throw "Python Launcher oficial ausente no runner Windows"
          }
          & "$env:SystemRoot\py.exe" -3.13 -I -S -c "import sys; raise SystemExit(sys.version_info[:3] != (3,13,15))"
          if ($LASTEXITCODE -ne 0) { throw "py.exe nao resolveu Python 3.13.15" }

          $smokeProfile = Join-Path $env:RUNNER_TEMP "erptbr-source-profile"
          $packageRoot = (Get-Location).Path
          # O checkout nao traz o payload grande. Este smoke testa somente o
          # bootstrap; a arvore real e autenticada no workflow de release.
          New-Item -ItemType Directory -Force (Join-Path $packageRoot "patch_data") | Out-Null
          $env:LOCALAPPDATA = $smokeProfile
          $env:ERPTBR_NONINTERACTIVE = "1"
          $env:ERPTBR_INSTALL_ONLY = "1"
          & (Join-Path $packageRoot "ERPT-BR.cmd")
          if ($LASTEXITCODE -ne 0) { throw "Smoke test real de ERPT-BR.cmd falhou" }
          $venvPython = Join-Path $smokeProfile "ERPT-BR\venv-0.9.5\Scripts\python.exe"
          $venvSite = Join-Path $smokeProfile "ERPT-BR\venv-0.9.5\Lib\site-packages"
          & $venvPython -I -S -c "import struct,sys,sysconfig; sys.path.extend((sys.argv[1],sys.argv[2])); import patcher.patcher_gui,tkinter,customtkinter; from Crypto.Cipher import AES; raise SystemExit(0 if sys.version_info[:3] == (3,13,15) and struct.calcsize('P') == 8 and sysconfig.get_platform().lower() == 'win-amd64' else 1)" $packageRoot $venvSite
          if ($LASTEXITCODE -ne 0) { throw "Smoke test isolado do ambiente instalado falhou" }
