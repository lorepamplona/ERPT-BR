name: Release single-package Windows patcher

on:
  push:
    tags:
      - "v0.9.4"

permissions: {}

jobs:
  build-and-test:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13.15"
          cache: pip
          cache-dependency-path: patcher/requirements-win64.lock

      - name: Verify pinned official Python bootstrap
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $url = "https://www.python.org/ftp/python/3.13.15/python-3.13.15-amd64.exe"
          $expectedHash = "edec09c4853aeae9ac36efb8c9f95b6b8e2fee65eee56d9767a8b7c69c574403"
          $expectedPublisher = "CN=Python Software Foundation, O=Python Software Foundation, L=Beaverton, S=Oregon, C=US"
          $manifestUrl = "https://raw.githubusercontent.com/microsoft/winget-pkgs/9a9e78cfec415bd294cced116b786562a9c32017/manifests/p/Python/Python/3/13/3.13.15/Python.Python.3.13.installer.yaml"
          $manifest = Join-Path $env:RUNNER_TEMP "Python.Python.3.13.installer.yaml"
          & "$env:SystemRoot\System32\curl.exe" --fail --show-error --proto "=https" --tlsv1.2 --retry 2 --output $manifest $manifestUrl
          $manifestHash = (Get-FileHash -LiteralPath $manifest -Algorithm SHA256).Hash
          if ($manifestHash -ne "7fe6aab138453720882711688ffb220f9fd81a42c56bfe7d4a10939e6de052c2") {
            throw "Manifesto WinGet fixado divergiu"
          }
          $metadata = Get-Content -LiteralPath $manifest -Raw
          foreach ($expected in @($url, $expectedHash)) {
            if ($metadata.IndexOf($expected, [StringComparison]::OrdinalIgnoreCase) -lt 0) {
              throw "Manifesto WinGet nao contem $expected"
            }
          }
          $installer = Join-Path $env:RUNNER_TEMP "python-3.13.15-amd64-verification.exe"
          & "$env:SystemRoot\System32\curl.exe" --fail --show-error --proto "=https" --tlsv1.2 --retry 2 --output $installer $url
          $item = Get-Item -LiteralPath $installer
          if ($item.Length -ne 29452944) { throw "Tamanho do instalador Python divergiu" }
          $actualHash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash
          if ($actualHash -ne $expectedHash) { throw "SHA-256 do instalador Python divergiu" }
          $signature = Get-AuthenticodeSignature -LiteralPath $installer
          if ($signature.Status -ne "Valid" -or $signature.SignerCertificate.Subject -ne $expectedPublisher) {
            throw "Assinatura ou publicador do instalador Python divergiu"
          }

      - name: Validate release version
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $expected = "v" + (python -c "import patcher; print(patcher.__version__)")
          if ("${{ github.ref_name }}" -ne $expected) {
            throw "Tag ${{ github.ref_name }} nao corresponde ao codigo $expected"
          }

      - name: Install and test locked environment
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip --isolated install `
            --disable-pip-version-check `
            --no-input `
            --require-hashes `
            --only-binary=:all: `
            -r patcher/requirements-win64.lock
          python -m pip check
          python -m compileall -q patcher tools
          python -m unittest discover -s tests -v

      - name: Download exact Windows wheels
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip --isolated download `
            --disable-pip-version-check `
            --no-input `
            --require-hashes `
            --only-binary=:all: `
            --dest wheelhouse `
            -r patcher/requirements-win64.lock

      # Pre-requisito de promocao: o asset grande e autenticado precisa existir
      # numa prerelease publicada de staging; ele nunca e anexado ao release final.
      - name: Download authenticated staging payload
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $stagingTag = "v0.9.4-rc.1"
          $stagingAsset = "patch_data_v094_rc1_wwise135_v2.zip"
          New-Item -ItemType Directory -Force payload-staging | Out-Null
          try {
            $staging = gh release view $stagingTag `
              --repo "${{ github.repository }}" `
              --json tagName,isDraft,isPrerelease | ConvertFrom-Json
            if ($staging.isDraft -or -not $staging.isPrerelease) {
              throw "A release de origem precisa ser uma prerelease publicada de staging."
            }
            gh release download $stagingTag `
              --repo "${{ github.repository }}" `
              --pattern $stagingAsset `
              --dir payload-staging
          } catch {
            throw "Pre-requisito ausente: publique primeiro o asset de staging $stagingTag/$stagingAsset. $($_.Exception.Message)"
          }
          $payload = Join-Path "payload-staging" $stagingAsset
          if (-not (Test-Path -LiteralPath $payload -PathType Leaf)) {
            throw "Pre-requisito ausente: asset de staging $stagingTag/$stagingAsset"
          }
          $item = Get-Item -LiteralPath $payload
          if ($item.Length -ne 588468447) {
            throw "Tamanho do payload de staging divergiu: $($item.Length)"
          }
          $hash = (Get-FileHash -LiteralPath $payload -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne "430e9693a9b3313826e9f7c890cf592eb5b468d145bb405e8a4586002b877680") {
            throw "SHA-256 do payload de staging divergiu: $hash"
          }

      - name: Build and verify single final ZIP
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          New-Item -ItemType Directory -Force dist | Out-Null
          $archive = "dist/ERPT-BR-v0.9.4-Windows.zip"
          python tools/build_source_release.py `
            --version "${{ github.ref_name }}" `
            --wheelhouse wheelhouse `
            --payload "payload-staging/patch_data_v094_rc1_wwise135_v2.zip" `
            --output $archive
          python tools/verify_source_release.py $archive
          $item = Get-Item $archive
          $hash = (Get-FileHash -Algorithm SHA256 $item.FullName).Hash.ToLowerInvariant()
          "SHA-256: ``$hash``" | Add-Content -Encoding utf8 $env:GITHUB_STEP_SUMMARY

      - name: Smoke test the real source installer
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          if (-not (Test-Path "$env:SystemRoot\py.exe")) {
            throw "Python Launcher oficial ausente no runner Windows"
          }
          & "$env:SystemRoot\py.exe" -3.13 -I -S -c "import sys; raise SystemExit(sys.version_info[:3] != (3,13,15))"
          if ($LASTEXITCODE -ne 0) { throw "py.exe nao resolveu Python 3.13.15" }
          $archive = "dist/ERPT-BR-v0.9.4-Windows.zip"
          $smokeRoot = Join-Path $env:RUNNER_TEMP "erptbr-source-install-smoke"
          $smokeProfile = Join-Path $env:RUNNER_TEMP "erptbr-source-profile"
          Expand-Archive -LiteralPath $archive -DestinationPath $smokeRoot
          $packageRoot = Get-ChildItem -LiteralPath $smokeRoot -Directory | Select-Object -First 1
          $env:LOCALAPPDATA = $smokeProfile
          $env:ERPTBR_NONINTERACTIVE = "1"
          $env:ERPTBR_INSTALL_ONLY = "1"
          & (Join-Path $packageRoot.FullName "ERPT-BR.cmd")
          if ($LASTEXITCODE -ne 0) { throw "Smoke test real de ERPT-BR.cmd falhou" }
          $venvPython = Join-Path $smokeProfile "ERPT-BR\venv-0.9.4\Scripts\python.exe"
          $venvSite = Join-Path $smokeProfile "ERPT-BR\venv-0.9.4\Lib\site-packages"
          $sourceRoot = $packageRoot.FullName
          & $venvPython -I -S -c "import struct,sys,sysconfig; sys.path.extend((sys.argv[1],sys.argv[2])); import patcher.patcher_gui,tkinter,customtkinter; from Crypto.Cipher import AES; raise SystemExit(0 if sys.version_info[:3] == (3,13,15) and struct.calcsize('P') == 8 and sysconfig.get_platform().lower() == 'win-amd64' else 1)" $sourceRoot $venvSite
          if ($LASTEXITCODE -ne 0) { throw "Smoke test isolado do ambiente instalado falhou" }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: erpt-br-v0.9.4-windows
          path: dist/ERPT-BR-v0.9.4-Windows.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: erpt-br-v0.9.4-windows
          path: dist

      - name: Attest immutable artifacts
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: dist/ERPT-BR-v0.9.4-Windows.zip

      - name: Publish new GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="dist/ERPT-BR-v0.9.4-Windows.zip"
          notes="docs/RELEASE-0.9.4.md"
          test -f "$archive"
          test -f "$notes"
          gh release create "v0.9.4" "$archive" \
            --repo "${{ github.repository }}" \
            --verify-tag \
            --notes-file "$notes" \
            --latest \
            --title "ERPT-BR v0.9.4 — Instalador completo para Windows"
