name: Release single-package Windows patcher

on:
  push:
    tags:
      - "v0.9.5"

permissions: {}

jobs:
  build-and-test:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13.15"
          cache: pip
          cache-dependency-path: patcher/requirements-win64.lock

      - name: Verify pinned official Python bootstrap
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $url = "https://www.python.org/ftp/python/3.13.15/python-3.13.15-amd64.exe"
          $expectedHash = "edec09c4853aeae9ac36efb8c9f95b6b8e2fee65eee56d9767a8b7c69c574403"
          $expectedPublisher = "CN=Python Software Foundation, O=Python Software Foundation, L=Beaverton, S=Oregon, C=US"
          $manifestUrl = "https://raw.githubusercontent.com/microsoft/winget-pkgs/9a9e78cfec415bd294cced116b786562a9c32017/manifests/p/Python/Python/3/13/3.13.15/Python.Python.3.13.installer.yaml"
          $manifest = Join-Path $env:RUNNER_TEMP "Python.Python.3.13.installer.yaml"
          & "$env:SystemRoot\System32\curl.exe" --fail --show-error --proto "=https" --tlsv1.2 --retry 2 --output $manifest $manifestUrl
          $manifestHash = (Get-FileHash -LiteralPath $manifest -Algorithm SHA256).Hash
          if ($manifestHash -ne "7fe6aab138453720882711688ffb220f9fd81a42c56bfe7d4a10939e6de052c2") {
            throw "Manifesto WinGet fixado divergiu"
          }
          $metadata = Get-Content -LiteralPath $manifest -Raw
          foreach ($expected in @($url, $expectedHash)) {
            if ($metadata.IndexOf($expected, [StringComparison]::OrdinalIgnoreCase) -lt 0) {
              throw "Manifesto WinGet nao contem $expected"
            }
          }
          $installer = Join-Path $env:RUNNER_TEMP "python-3.13.15-amd64-verification.exe"
          & "$env:SystemRoot\System32\curl.exe" --fail --show-error --proto "=https" --tlsv1.2 --retry 2 --output $installer $url
          $item = Get-Item -LiteralPath $installer
          if ($item.Length -ne 29452944) { throw "Tamanho do instalador Python divergiu" }
          $actualHash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash
          if ($actualHash -ne $expectedHash) { throw "SHA-256 do instalador Python divergiu" }
          $signature = Get-AuthenticodeSignature -LiteralPath $installer
          if ($signature.Status -ne "Valid" -or $signature.SignerCertificate.Subject -ne $expectedPublisher) {
            throw "Assinatura ou publicador do instalador Python divergiu"
          }

      - name: Validate release version
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $expected = "v" + (python -c "import patcher; print(patcher.__version__)")
          if ("${{ github.ref_name }}" -ne $expected) {
            throw "Tag ${{ github.ref_name }} nao corresponde ao codigo $expected"
          }

      - name: Install and test locked environment
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip --isolated install `
            --disable-pip-version-check `
            --no-input `
            --require-hashes `
            --only-binary=:all: `
            -r patcher/requirements-win64.lock
          python -m pip check
          python -m compileall -q patcher tools
          python -m unittest discover -s tests -v

      - name: Download exact Windows wheels
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip --isolated download `
            --disable-pip-version-check `
            --no-input `
            --require-hashes `
            --only-binary=:all: `
            --dest wheelhouse `
            -r patcher/requirements-win64.lock

      # Pre-requisito de promocao: o asset grande e autenticado precisa existir
      # numa prerelease publicada de staging. Seus arquivos sao incorporados de
      # forma plana; o ZIP de staging nunca e aninhado no release final.
      - name: Download authenticated staging payload
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $stagingTag = "v0.9.4-rc.1"
          $stagingAsset = "patch_data_v094_rc1_wwise135_v2.zip"
          New-Item -ItemType Directory -Force payload-staging | Out-Null
          try {
            $staging = gh release view $stagingTag `
              --repo "${{ github.repository }}" `
              --json tagName,isDraft,isPrerelease | ConvertFrom-Json
            if ($staging.isDraft -or -not $staging.isPrerelease) {
              throw "A release de origem precisa ser uma prerelease publicada de staging."
            }
            gh release download $stagingTag `
              --repo "${{ github.repository }}" `
              --pattern $stagingAsset `
              --dir payload-staging
          } catch {
            throw "Pre-requisito ausente: publique primeiro o asset de staging $stagingTag/$stagingAsset. $($_.Exception.Message)"
          }
          $payload = Join-Path "payload-staging" $stagingAsset
          if (-not (Test-Path -LiteralPath $payload -PathType Leaf)) {
            throw "Pre-requisito ausente: asset de staging $stagingTag/$stagingAsset"
          }
          $item = Get-Item -LiteralPath $payload
          if ($item.Length -ne 588468447) {
            throw "Tamanho do payload de staging divergiu: $($item.Length)"
          }
          $hash = (Get-FileHash -LiteralPath $payload -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne "430e9693a9b3313826e9f7c890cf592eb5b468d145bb405e8a4586002b877680") {
            throw "SHA-256 do payload de staging divergiu: $hash"
          }

      - name: Build and verify single final ZIP
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          New-Item -ItemType Directory -Force dist | Out-Null
          $archive = "dist/ERPT-BR-v0.9.5-Windows.zip"
          python tools/build_source_release.py `
            --version "${{ github.ref_name }}" `
            --wheelhouse wheelhouse `
            --payload "payload-staging/patch_data_v094_rc1_wwise135_v2.zip" `
            --output $archive
          python tools/verify_source_release.py $archive
          $item = Get-Item $archive
          $hash = (Get-FileHash -Algorithm SHA256 $item.FullName).Hash.ToLowerInvariant()
          "SHA-256: ``$hash``" | Add-Content -Encoding utf8 $env:GITHUB_STEP_SUMMARY

      - name: Smoke test the real source installer
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          if (-not (Test-Path "$env:SystemRoot\py.exe")) {
            throw "Python Launcher oficial ausente no runner Windows"
          }
          & "$env:SystemRoot\py.exe" -3.13 -I -S -c "import sys; raise SystemExit(sys.version_info[:3] != (3,13,15))"
          if ($LASTEXITCODE -ne 0) { throw "py.exe nao resolveu Python 3.13.15" }
          $archive = "dist/ERPT-BR-v0.9.5-Windows.zip"
          $smokeRoot = Join-Path $env:RUNNER_TEMP "erptbr-source-install-smoke"
          $smokeProfile = Join-Path $env:RUNNER_TEMP "erptbr-source-profile"
          Expand-Archive -LiteralPath $archive -DestinationPath $smokeRoot
          $packageRoot = Get-ChildItem -LiteralPath $smokeRoot -Directory | Select-Object -First 1
          $env:LOCALAPPDATA = $smokeProfile
          $env:ERPTBR_NONINTERACTIVE = "1"
          $env:ERPTBR_INSTALL_ONLY = "1"
          & (Join-Path $packageRoot.FullName "ERPT-BR.cmd")
          if ($LASTEXITCODE -ne 0) { throw "Smoke test real de ERPT-BR.cmd falhou" }
          $venvPython = Join-Path $smokeProfile "ERPT-BR\venv-0.9.5\Scripts\python.exe"
          $venvSite = Join-Path $smokeProfile "ERPT-BR\venv-0.9.5\Lib\site-packages"
          $sourceRoot = $packageRoot.FullName
          & $venvPython -I -S -c "import struct,sys,sysconfig; sys.path.extend((sys.argv[1],sys.argv[2])); import patcher.patcher_gui,tkinter,customtkinter; from Crypto.Cipher import AES; raise SystemExit(0 if sys.version_info[:3] == (3,13,15) and struct.calcsize('P') == 8 and sysconfig.get_platform().lower() == 'win-amd64' else 1)" $sourceRoot $venvSite
          if ($LASTEXITCODE -ne 0) { throw "Smoke test isolado do ambiente instalado falhou" }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: erpt-br-v0.9.5-windows
          path: dist/ERPT-BR-v0.9.5-Windows.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: erpt-br-v0.9.5-windows
          path: dist

      - name: Attest immutable artifacts
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: dist/ERPT-BR-v0.9.5-Windows.zip

      - name: Publish new GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="dist/ERPT-BR-v0.9.5-Windows.zip"
          notes="docs/RELEASE-0.9.5.md"
          tag="v0.9.5"
          title="ERPT-BR v0.9.5 — Pacote plano para Windows"
          test -f "$archive"
          test -f "$notes"
          local_size="$(wc -c < "$archive" | tr -d '[:space:]')"
          local_digest="sha256:$(sha256sum "$archive" | cut -d' ' -f1)"

          # Confirma que a tag anotada ja existe, equivalente ao --verify-tag.
          gh api "repos/${{ github.repository }}/git/ref/tags/$tag" --silent

          # O endpoint /releases/tags nao retorna drafts de forma confiavel.
          # Liste releases autenticadas e reutilize somente uma release exata,
          # tornando uma nova execucao segura sem sobrescrever nenhum asset.
          releases="$RUNNER_TEMP/erptbr-releases.json"
          gh api "repos/${{ github.repository }}/releases?per_page=100" > "$releases"
          existing_count="$(jq --arg tag "$tag" '[.[] | select(.tag_name == $tag)] | length' "$releases")"
          if [ "$existing_count" = "0" ]; then
            create_request="$RUNNER_TEMP/erptbr-v095-create.json"
            create_response="$RUNNER_TEMP/erptbr-v095-release.json"
            jq -n \
              --arg tag "$tag" \
              --arg title "$title" \
              --rawfile body "$notes" \
              '{tag_name:$tag, name:$title, body:$body, draft:true, prerelease:false, make_latest:"false"}' \
              > "$create_request"
            gh api --method POST \
              "repos/${{ github.repository }}/releases" \
              --input "$create_request" > "$create_response"
            release_id="$(jq -r '.id' "$create_response")"
            release_was_draft="true"
          elif [ "$existing_count" = "1" ]; then
            if ! jq -e \
              --arg tag "$tag" \
              --arg title "$title" \
              --rawfile body "$notes" \
              '.[] | select(.tag_name == $tag and .prerelease == false and .name == $title and .body == $body)' \
              "$releases" > /dev/null; then
              echo "A release existente nao corresponde exatamente ao release esperado." >&2
              exit 1
            fi
            release_id="$(jq -r --arg tag "$tag" '.[] | select(.tag_name == $tag) | .id' "$releases")"
            release_was_draft="$(jq -r --arg tag "$tag" '.[] | select(.tag_name == $tag) | .draft' "$releases")"
          else
            echo "Mais de uma release usa a tag $tag." >&2
            exit 1
          fi
          test -n "$release_id"
          upload_template="$(gh api "repos/${{ github.repository }}/releases/${release_id}" --jq '.upload_url')"
          upload_url="$(printf '%s' "$upload_template" | sed 's/{.*$//')"
          test -n "$upload_url"

          # O upload comum do gh identificava o ZIP grande como
          # application/octet-stream. O endpoint de assets aceita o MIME
          # explicito, e a release permanece em rascunho se qualquer
          # verificacao abaixo falhar.
          assets="$RUNNER_TEMP/erptbr-v095-assets.json"
          gh api "repos/${{ github.repository }}/releases/${release_id}/assets" > "$assets"
          asset_count="$(jq 'length' "$assets")"
          if [ "$asset_count" = "1" ] && [ "$(jq -r '.[0].state' "$assets")" = "starter" ]; then
            # A API documenta que um 502 pode deixar um asset incompleto neste
            # estado. Remova somente esse residuo dentro do draft exato.
            test "$release_was_draft" = "true"
            stale_id="$(jq -r '.[0].id' "$assets")"
            gh api --method DELETE "repos/${{ github.repository }}/releases/assets/${stale_id}"
            asset_count="0"
          fi
          if [ "$asset_count" = "0" ]; then
            test "$release_was_draft" = "true"
            response="$RUNNER_TEMP/erptbr-v095-upload.json"
            curl --fail-with-body --silent --show-error --location \
              --request POST \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --header "Content-Type: application/zip" \
              --data-binary "@$archive" \
              --output "$response" \
              "${upload_url}?name=ERPT-BR-v0.9.5-Windows.zip"
            gh api "repos/${{ github.repository }}/releases/${release_id}/assets" > "$assets"
            asset_count="$(jq 'length' "$assets")"
          fi

          asset_name="$(jq -r '.[0].name' "$assets")"
          asset_type="$(jq -r '.[0].content_type' "$assets")"
          asset_size="$(jq -r '.[0].size' "$assets")"
          asset_digest="$(jq -r '.[0].digest' "$assets")"
          asset_state="$(jq -r '.[0].state' "$assets")"
          test "$asset_count" = "1"
          test "$asset_name" = "ERPT-BR-v0.9.5-Windows.zip"
          test "$asset_type" = "application/zip"
          test "$asset_size" = "$local_size"
          test "$asset_digest" = "$local_digest"
          test "$asset_state" = "uploaded"

          publish_request="$RUNNER_TEMP/erptbr-v095-publish.json"
          publish_response="$RUNNER_TEMP/erptbr-v095-published.json"
          jq -n '{draft:false, make_latest:"true"}' > "$publish_request"
          gh api --method PATCH \
            "repos/${{ github.repository }}/releases/${release_id}" \
            --input "$publish_request" > "$publish_response"
          test "$(jq -r '.draft' "$publish_response")" = "false"
          test "$(gh api "repos/${{ github.repository }}/releases/latest" --jq '.tag_name')" = "$tag"
